<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAI Malaysia - Platform Pembelajaran Pintar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [token, setToken] = useState(localStorage.getItem('studyai_token') || '');
      const [currentView, setCurrentView] = useState('dashboard');
      const [user, setUser] = useState(null);
      const [lang, setLang] = useState('bm');

      // Auth State
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoginMode, setIsLoginMode] = useState(true);

      useEffect(() => {
        if (token) {
          fetch('/api/v1/auth/me', { headers: { 'Authorization': `Bearer ${token}` } })
            .then(res => res.json())
            .then(data => {
              if (data.success) setUser(data.user);
              else setToken('');
            })
            .catch(() => setToken(''));
        }
      }, [token]);

      const handleAuth = async (e) => {
        e.preventDefault();
        const endpoint = isLoginMode ? '/api/v1/auth/login' : '/api/v1/auth/signup';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name: 'Pelajar StudyAI' })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('studyai_token', data.token);
          setToken(data.token);
          setUser(data.user);
        } else {
          alert(data.error);
        }
      };

      if (!token || !user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl max-w-md w-full space-y-6">
              <div className="text-center">
                <div className="bg-indigo-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3 font-bold text-lg">AI</div>
                <h2 className="text-2xl font-bold text-slate-900">StudyAI Malaysia</h2>
                <p className="text-xs text-slate-500 mt-1">Platform Pembelajaran Pintar Berkuasa AI</p>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Emel</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-600 focus:outline-none" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Kata Laluan</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-600 focus:outline-none" required />
                </div>
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl text-sm shadow-md transition">
                  {isLoginMode ? 'Log Masuk' : 'Daftar Akaun Baru'}
                </button>
              </form>

              <div className="text-center">
                <button onClick={() => setIsLoginMode(!isLoginMode)} className="text-xs text-indigo-600 font-semibold hover:underline">
                  {isLoginMode ? 'Belum ada akaun? Daftar sekarang' : 'Sudah ada akaun? Log masuk'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
          <aside className="hidden md:flex w-72 bg-white border-r border-slate-200 flex-col h-screen sticky top-0 p-6 space-y-6">
            <div className="flex items-center space-x-3">
              <div className="bg-indigo-600 text-white p-2.5 rounded-2xl font-bold">AI</div>
              <div>
                <h1 className="font-extrabold text-slate-900 text-base">StudyAI</h1>
                <span className="text-xs text-indigo-600 font-bold">Malaysia</span>
              </div>
            </div>

            <nav className="flex-1 space-y-1.5 overflow-y-auto">
              {[
                { id: 'dashboard', label: 'Utama' },
                { id: 'tutor', label: 'Tutor AI Adaptif' },
                { id: 'library', label: 'Perpustakaan' },
                { id: 'admin', label: 'Admin Dashboard' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setCurrentView(item.id)}
                  className={`w-full text-left px-4 py-3 rounded-2xl font-bold text-sm transition ${currentView === item.id ? 'bg-indigo-50 text-indigo-700 shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  {item.label}
                </button>
              ))}
            </nav>

            <div className="pt-4 border-t border-slate-100">
              <button onClick={() => { localStorage.removeItem('studyai_token'); setToken(''); }} className="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold py-2.5 rounded-xl text-xs">
                Log Keluar
              </button>
            </div>
          </aside>

          <main className="flex-1 p-6 md:p-10 max-w-6xl mx-auto w-full overflow-y-auto">
            {currentView === 'dashboard' && (
              <div className="space-y-6">
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900">Selamat kembali, {user.name}!</h2>
                    <p className="text-slate-500 text-sm">Teruskan kecemerlangan pembelajaran anda hari ini.</p>
                  </div>
                  <div className="bg-indigo-50 border border-indigo-100 px-4 py-2 rounded-2xl text-xs font-bold text-indigo-700">
                    Peranan: {user.role} • Pelan: {user.subscriptionTier || 'Free'}
                  </div>
                </div>
              </div>
            )}

            {currentView === 'tutor' && (
              <div className="bg-white rounded-3xl border border-slate-200 h-[calc(100vh-8rem)] flex flex-col shadow-sm overflow-hidden">
                <div className="p-4 border-b bg-slate-50 font-bold text-sm">StudyAI Adaptive Tutor (OpenAI GPT-4o Terintegrasi)</div>
                <div className="flex-1 p-6 overflow-y-auto">
                  <p className="text-sm text-slate-600">Sila mulakan sesi perbualan adaptif dengan menaip soalan di bawah.</p>
                </div>
                <div className="p-4 border-t flex space-x-2">
                  <input type="text" placeholder="Tanya soalan subjek..." className="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" />
                  <button className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold text-sm">Hantar</button>
                </div>
              </div>
            )}

            {currentView === 'admin' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 className="text-xl font-bold text-slate-900">Admin Dashboard (RBAC Protected)</h3>
                <p className="text-xs text-slate-500">Hanya pengguna dengan peranan ADMIN di pangkalan data boleh mengakses endpoint pelayan ini.</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
